name: Build & Test

# PumpKIN is a public repository, so GitHub-hosted runner minutes are free.
# Keep it that way: do not add private runners or paid services here.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  macos-build-test:
    name: Build and test on macOS (arm64)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build app and helper (Debug, unsigned)
        run: >-
          xcodebuild build
          -project pumpkin.xcodeproj
          -scheme pumpkin
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: >-
          xcodebuild test
          -project pumpkin.xcodeproj
          -scheme pumpkin
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build biportal helper standalone (warnings as errors)
        run: cc -Wall -Wextra -Werror -fsyntax-only biportal/main.c
